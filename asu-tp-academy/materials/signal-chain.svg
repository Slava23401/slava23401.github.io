<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Учебная связь К01 от контакта к логическому сигналу</title><desc id="desc">Только функциональное чтение обозначений. S1, кабель К01, X1 и DI1 условного стенда; логическая модель и проектные параметры уточняются.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#1b668d"/></marker></defs><rect width="1000" height="590" rx="16" fill="#f7faff"/><style>text{font-family:Arial,sans-serif;fill:#18344e;font-size:20px}.small{font-size:16px;fill:#52677c}.title{font-size:28px;font-weight:700}.line{fill:none;stroke:#1b668d;stroke-width:3}.box{fill:#fff;stroke:#8aa9bd;stroke-width:2}.warn{fill:#a05a08}</style><text x="40" y="48" class="title">Одна цепь на вымышленном стенде</text><text x="40" y="80" class="small">Не схема реального выключателя и не основание для монтажа.</text><rect x="40" y="140" width="190" height="130" rx="10" class="box"/><text x="62" y="179">① Контакт S1</text><text x="62" y="212" class="small">условные выводы 1/2</text><text x="62" y="241" class="small">состояние источника</text><path class="line" d="M230 205H375" marker-end="url(#arrow)"/><text x="260" y="180">② К01</text><rect x="385" y="140" width="220" height="130" rx="10" class="box"/><text x="405" y="179">③ Ш1 / X1</text><text x="405" y="212" class="small">условные X1:1 / X1:2</text><text x="405" y="241" class="small">конец кабеля в журнале</text><path class="line" d="M605 205H750" marker-end="url(#arrow)"/><rect x="760" y="140" width="200" height="130" rx="10" class="box"/><text x="780" y="180">④ Вход DI1</text><text x="780" y="213" class="small">параметры не заданы</text><path class="line" d="M860 270V345H650" marker-end="url(#arrow)"/><rect x="340" y="310" width="300" height="105" rx="10" class="box"/><text x="360" y="350">⑤ Логическая модель</text><text x="360" y="382" class="small">смысл, качество, время</text><path class="line" d="M340 362H240" marker-end="url(#arrow)"/><rect x="40" y="310" width="190" height="105" rx="10" class="box"/><text x="60" y="352">Учебный ДП</text><text x="60" y="383" class="small">через согласованный</text><text x="60" y="405" class="small">канал обмена</text><text x="40" y="465" class="small">Показана одна условная цепь. DI1 нельзя автоматически считать целым объектом DP.</text><text x="40" y="497" class="small">Электрические параметры, питание входа, защиты и полная схема здесь не заданы.</text><text x="40" y="548" class="small">Перекрёстная проверка: К01 → строка журнала → те же S1 и Ш1/X1.</text></svg>