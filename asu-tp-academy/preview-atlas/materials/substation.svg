<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Условная однолинейная схема ПС Учебная</title><desc id="desc">Шины 35 кВ, две ветви с выключателями В35Т1 и В35Т2 и трансформаторами 35/10 кВ. Упрощено, не для монтажа.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#1b668d"/></marker></defs><rect width="1000" height="620" rx="16" fill="#f7faff"/><style>text{font-family:Arial,sans-serif;fill:#18344e;font-size:20px}.small{font-size:16px;fill:#52677c}.title{font-size:28px;font-weight:700}.line{fill:none;stroke:#1b668d;stroke-width:3}.box{fill:#fff;stroke:#8aa9bd;stroke-width:2}.warn{fill:#a05a08}</style><text x="40" y="48" class="title">ПС «Учебная» · фрагмент первичной схемы</text><text x="40" y="78" class="small">Не существующий объект. Разъединители, защиты и другие цепи здесь не показаны.</text><path class="line" d="M150 145H850" stroke-width="7"/><text x="430" y="128">Шины 35 кВ</text><path class="line" d="M300 145V215M700 145V215M300 255V325M700 255V325"/><rect x="280" y="215" width="40" height="40" class="box"/><rect x="680" y="215" width="40" height="40" class="box"/><text x="345" y="243">В35Т1</text><text x="745" y="243">В35Т2</text><circle cx="300" cy="345" r="27" class="box"/><circle cx="300" cy="382" r="27" class="box"/><circle cx="700" cy="345" r="27" class="box"/><circle cx="700" cy="382" r="27" class="box"/><text x="345" y="370">Т1 · 35/10 кВ</text><text x="745" y="370">Т2 · 35/10 кВ</text><path class="line" d="M300 409V460M700 409V460M170 460H430M570 460H830"/><text x="200" y="494">Ветвь 10 кВ</text><text x="600" y="494">Ветвь 10 кВ</text><text x="40" y="550" class="small">Задание: найдите аппарат, назовите требуемые сведения о его вторичных цепях.</text><text x="40" y="580" class="small">По этому рисунку нельзя назначить контакты, клеммы или жилы кабеля ТМ.</text></svg>