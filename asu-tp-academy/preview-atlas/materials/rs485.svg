<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="725" viewBox="0 0 1000 725" role="img" aria-labelledby="title desc"><title id="title">Учебное сравнение топологий RS-485</title><desc id="desc">Вверху длинная звезда с окончаниями на ветвях как проблемный эскиз. Внизу принцип магистрали с окончаниями на концах, требующий проверки по паспортам.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#1b668d"/></marker></defs><rect width="1000" height="725" rx="16" fill="#f7faff"/><style>text{font-family:Arial,sans-serif;fill:#18344e;font-size:20px}.small{font-size:16px;fill:#52677c}.title{font-size:28px;font-weight:700}.line{fill:none;stroke:#1b668d;stroke-width:3}.box{fill:#fff;stroke:#8aa9bd;stroke-width:2}.warn{fill:#a05a08}</style><text x="40" y="48" class="title">RS-485: эскиз для поиска ошибок</text><text x="40" y="82" class="small">Без номиналов и монтажных указаний. Решение проверяется по документации устройств.</text><text x="40" y="125" class="warn">A. Проблемный эскиз: длинные ветви и много окончаний</text><rect x="420" y="190" width="160" height="60" rx="8" class="box"/><text x="445" y="228">Контроллер</text><path class="line" d="M420 220H230M580 220H770M500 250V315"/><rect x="60" y="190" width="170" height="60" rx="8" class="box"/><text x="80" y="228">Прибор + R</text><rect x="770" y="190" width="170" height="60" rx="8" class="box"/><text x="790" y="228">Прибор + R</text><rect x="415" y="315" width="170" height="60" rx="8" class="box"/><text x="435" y="353">Прибор + R</text><text x="40" y="425">B. Принцип магистрали, а не готовое монтажное решение</text><path class="line" d="M100 505H900M320 505V555M650 505V555"/><rect x="75" y="488" width="30" height="34" class="box"/><rect x="895" y="488" width="30" height="34" class="box"/><text x="65" y="480" class="small">конец</text><text x="880" y="480" class="small">конец</text><rect x="230" y="555" width="180" height="55" rx="8" class="box"/><text x="251" y="589">Контроллер</text><rect x="565" y="555" width="170" height="55" rx="8" class="box"/><text x="600" y="589">Прибор</text><text x="40" y="658" class="small">Проверить: длины, скорость, ответвления, окончания, смещение, общий потенциал,</text><text x="40" y="687" class="small">изоляцию, экран, УЗИП и полярность. GND и PE не соединяют по универсальному правилу.</text></svg>